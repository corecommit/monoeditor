name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs race to update the rolling "latest" release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apk:
    name: Build APK (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | head -n 1 || true)"
          fi
          if [ -z "${SDKMANAGER:-}" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ${SDK_ROOT}" >&2
            exit 1
          fi
          echo "Using sdkmanager: ${SDKMANAGER}"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # The wrapper jar is committed with the repo; this guard keeps CI working
      # even for consumers who strip jar files from their checkouts.
      - name: Bootstrap Gradle wrapper (if jar missing)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Install toolchain script dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd binutils xz-utils zip patchelf

      - name: Provision on-device clang toolchain
        run: |
          chmod +x ./toolchain/setup-toolchain.sh
          ./toolchain/setup-toolchain.sh

      - name: Prepare signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using keystore from repository secrets."
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "MONO_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "MONO_KEYSTORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "MONO_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "MONO_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No signing secrets found; generating a fresh CI debug keystore."
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/release.keystore" \
              -storetype PKCS12 \
              -storepass mono-ci \
              -alias mono \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Mono CI, OU=Build, O=Mono, C=US"
            echo "MONO_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "MONO_KEYSTORE_PASSWORD=mono-ci" >> "$GITHUB_ENV"
            echo "MONO_KEY_ALIAS=mono" >> "$GITHUB_ENV"
            echo "MONO_KEY_PASSWORD=mono-ci" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Release APK is built for every push to main and every v* tag
      # (not for pull requests).
      - name: Build release APK
        if: github.event_name != 'pull_request'
        run: ./gradlew --no-daemon assembleRelease

      # Rolling release: every push to main moves the "latest" tag to the
      # new commit and replaces the APK on the "latest" GitHub Release.
      - name: Move "latest" tag to this commit (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

      - name: Publish "latest" release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automated release build of `${{ github.sha }}` from `main`.
          make_latest: true
          prerelease: false
          overwrite_files: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            toolchain/work/sysroot-only.zip

      # Versioned releases for v* tags.
      - name: Publish versioned release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            toolchain/work/sysroot-only.zip
